site_name: AI Lab
site_description: 인공지능 공부 기록장
# 배포 후 본인 주소로 바꾸세요: https://<아이디>.github.io/<저장소명>/
site_url: ""
repo_url: ""

theme:
  name: material
  language: ko
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 다크 모드
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  icon:
    logo: material/brain
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - 홈: index.md
  - 로드맵: roadmap.md
  - 노트:
      - notes/index.md
      - 트랜스포머: notes/transformer.md
  - 실습: practice/index.md
  - 자료: resources/index.md
